schema: 3
id: vbc
name: VBC
image:
  repository: ghcr.io/hipotures/vbc
runtime:
  telemetry: homestack
  ports:
    - name: http
      port: 8080
      protocol: tcp
  healthcheck:
    type: http
    port: http
    path: /health/ready
    expected_status: 200
    heartbeat_seconds: 60
# GPU (NVENC): runtime.devices (dev0..dev3 = /dev/nvidia0, nvidiactl, nvidia-uvm,
# nvidia-uvm-tools) only once HomeStack attaches devices itself; HomeStack
# refuses updates while declared devices are not attached in Proxmox.
# See deploy/container/README.md (GPU).
# Config (incl. the Dirs list saved through the API) and state live on the
# home volume; media trees are external mounts (pending HomeStack feature).
persistence:
  mount: /home/app
  size: 1G
  directories:
    - config
    - state
# Remote access through Pangolin, behind its login (the API has no auth of
# its own; it controls processing only and never serves media).
exposure:
  pangolin:
    port: http
    name: VBC
    subdomain: vbc
