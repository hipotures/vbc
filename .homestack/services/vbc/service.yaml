schema: 3
id: vbc
name: VBC
image:
  repository: ghcr.io/hipotures/vbc
runtime:
  telemetry: homestack
  ports:
    - name: http
      port: 8080
      protocol: tcp
  # GPU (NVENC): NVIDIA device nodes. See deploy/container/README.md (GPU).
  devices:
    dev0:
      path: /dev/nvidia0
    dev1:
      path: /dev/nvidiactl
    dev2:
      path: /dev/nvidia-uvm
    dev3:
      path: /dev/nvidia-uvm-tools
  healthcheck:
    type: http
    port: http
    path: /health/ready
    expected_status: 200
    heartbeat_seconds: 60
# Config (incl. the Dirs list saved through the API) and state live on the
# home volume; media trees are external mounts (pending HomeStack feature).
persistence:
  mount: /home/app
  size: 1G
  directories:
    - config
    - state
# Remote access through Pangolin, behind its login (the API has no auth of
# its own; it controls processing only and never serves media).
exposure:
  pangolin:
    port: http
    name: VBC
    subdomain: vbc
