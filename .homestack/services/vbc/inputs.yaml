schema: 3
service: vbc
inputs:
  - id: storage_roots
    label: Storage roots
    description: Usually empty. Every media mount of the container is already allowed; add comma-separated absolute container paths only for other places input folders and their _out/_err siblings may live.
    type: string
    required: false
    max_length: 2000
    regex: '^/[^,]*(,/[^,]*)*$'
    target:
      type: environment
      variable: VBC_STORAGE_ROOTS
  - id: allowed_hosts
    label: Allowed host names
    description: Usually empty. The server already accepts its host name, <hostname>.<domain> and IP addresses; add only other names clients use to reach it (e.g. a Pangolin subdomain), comma-separated.
    type: string
    required: false
    max_length: 1000
    target:
      type: environment
      variable: VBC_ALLOWED_HOSTS
