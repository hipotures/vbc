[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vbc"
version = "1.0.0"
description = "VBC - Video Batch Compression with AV1/NVENC support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "inotify-simple>=2.0.1",
    "pydantic>=2.12.5",
    "pyexiftool>=0.5.6",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer>=0.20.1",
    "uvicorn>=0.32",
]

[project.scripts]
vbc = "vbc.cli:app"

[dependency-groups]
# Install just the headless runtime with `uv sync --only-group server`.
# Versions are resolved together with the project and pinned in uv.lock.
server = [
    "fastapi",
    "httpx",
    "inotify-simple",
    "pydantic",
    "pyexiftool",
    "pyyaml",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7",
]

[tool.hatch.build.targets.wheel]
packages = ["vbc"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "e2e: black-box end-to-end scenario (real processes, real ffmpeg/exiftool)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
